<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>借閱記錄管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
            background-color: #f5f5f0;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            margin-bottom: 60px;
            text-align: center;
            border-bottom: 1px solid #e0e0d9;
            padding-bottom: 30px;
        }

        h1 {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            font-size: 14px;
            color: #999;
            letter-spacing: 1px;
        }

        .nav-links {
            margin-top: 20px;
            text-align: center;
        }

        .nav-links a {
            display: inline-block;
            margin: 0 15px;
            padding: 10px 20px;
            color: #666;
            text-decoration: none;
            border: 1px solid #e0e0d9;
            border-radius: 2px;
            transition: all 0.3s ease;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .nav-links a:hover {
            border-color: #333;
            color: #333;
            background-color: #f5f5f0;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 40px;
            margin-bottom: 60px;
        }

        .form-section {
            background: white;
            padding: 30px;
            border: 1px solid #e0e0d9;
        }

        .form-title {
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f0f0eb;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e0e0d9;
            background-color: #fafaf8;
            font-size: 13px;
            color: #333;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: #999;
            background-color: white;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: 1px solid #333;
            background-color: white;
            color: #333;
            font-size: 13px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        button:hover {
            background-color: #333;
            color: white;
        }

        button.danger {
            border-color: #d32f2f;
            color: #d32f2f;
        }

        button.danger:hover {
            background-color: #d32f2f;
            color: white;
        }

        button.success {
            border-color: #2e7d32;
            color: #2e7d32;
        }

        button.success:hover {
            background-color: #2e7d32;
            color: white;
        }

        .table-section {
            background: white;
            padding: 30px;
            border: 1px solid #e0e0d9;
        }

        .table-title {
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f0f0eb;
            letter-spacing: 1px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead {
            background-color: #f5f5f0;
            border-bottom: 2px solid #e0e0d9;
        }

        th {
            padding: 15px 12px;
            text-align: left;
            font-weight: 500;
            color: #666;
            letter-spacing: 0.5px;
        }

        td {
            padding: 15px 12px;
            border-bottom: 1px solid #f0f0eb;
        }

        tr:hover {
            background-color: #fafaf8;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 2px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .status-returned {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .status-borrowed {
            background-color: #fff3e0;
            color: #f57c00;
        }

        .status-overdue {
            background-color: #ffebee;
            color: #d32f2f;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .action-buttons button {
            flex: 1;
            padding: 8px 10px;
            font-size: 11px;
            border: 1px solid #e0e0d9;
            background-color: white;
            color: #333;
        }

        .action-buttons button.return-btn {
            border-color: #2e7d32;
            color: #2e7d32;
        }

        .action-buttons button.return-btn:hover {
            background-color: #2e7d32;
            color: white;
        }

        .action-buttons button.delete-btn {
            border-color: #d32f2f;
            color: #d32f2f;
        }

        .action-buttons button.delete-btn:hover {
            background-color: #d32f2f;
            color: white;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 40px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border: 1px solid #e0e0d9;
            text-align: center;
        }

        .stat-number {
            font-size: 28px;
            font-weight: 300;
            color: #333;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            letter-spacing: 1px;
        }

        .message {
            padding: 15px 20px;
            margin-bottom: 20px;
            border-radius: 2px;
            font-size: 13px;
        }

        .message.success {
            background-color: #e8f5e9;
            color: #2e7d32;
            border-left: 3px solid #2e7d32;
        }

        .message.error {
            background-color: #ffebee;
            color: #d32f2f;
            border-left: 3px solid #d32f2f;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-text {
            font-size: 14px;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            h1 {
                font-size: 24px;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 10px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>借閱記錄管理</h1>
            <p class="subtitle">BORROW RECORD MANAGEMENT SYSTEM</p>
            <div class="nav-links">
                <a href="http://localhost:8081/">回首頁</a>
                <a href="http://localhost:8081/books.html">書籍管理</a>
                <a href="http://localhost:8080/borrow.html">借閱管理</a>
            </div>
        </header>

        <div id="messageContainer"></div>

        <div class="main-content">
            <div class="form-section">
                <div class="form-title">新增借閱記錄</div>
                <form id="borrowForm">
                    <div class="form-group">
                        <label for="bookId">書籍編號 *</label>
                        <input type="number" id="bookId" name="bookId" min="1" required>
                    </div>

                    <div class="form-group">
                        <label for="borrower">借閱人 *</label>
                        <input type="text" id="borrower" name="borrower" placeholder="請輸入借閱人姓名" required>
                    </div>

                    <div class="form-group">
                        <label for="borrowDate">借閱日期 *</label>
                        <input type="date" id="borrowDate" name="borrowDate" required>
                    </div>

                    <div class="form-group">
                        <label for="dueDate">應還日期 *</label>
                        <input type="date" id="dueDate" name="dueDate" required>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="success">新增記錄</button>
                        <button type="reset">清除</button>
                    </div>
                </form>
            </div>

            <div class="table-section">
                <div class="table-title">借閱記錄列表</div>
                <div id="tableContainer" class="table-wrapper">
                    <div class="empty-state">
                        <div class="empty-state-text">目前沒有借閱記錄</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalRecords">0</div>
                <div class="stat-label">總借閱記錄</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="borrowedCount">0</div>
                <div class="stat-label">未還書</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="returnedCount">0</div>
                <div class="stat-label">已還書</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="overdueCount">0</div>
                <div class="stat-label">逾期未還</div>
            </div>
        </div>
    </div>

    <script>
        const BORROW_API = 'http://localhost:8080/api/borrows';
        const BOOK_API = 'http://localhost:8081/api/books';
        let borrowRecords = [];
        let allBooks = [];
        let editingId = null;

        // Set today's date as default
        document.getElementById('borrowDate').valueAsDate = new Date();

        // Load books from Service A on page load
        function loadAvailableBooks() {
            return fetch(BOOK_API)
                .then(response => {
                    if (!response.ok) throw new Error('無法載入書籍');
                    return response.json();
                })
                .then(books => {
                    allBooks = books;
                    populateBookSelect();
                })
                .catch(error => {
                    console.error('Error loading books:', error);
                });
        }

        // Populate book selection dropdown
        function populateBookSelect() {
            const bookIdInput = document.getElementById('bookId');
            const select = document.createElement('select');
            select.id = 'bookId';
            select.name = 'bookId';
            select.required = true;
            
            const defaultOption = document.createElement('option');
            defaultOption.value = '';
            defaultOption.textContent = '-- 選擇書籍 --';
            select.appendChild(defaultOption);
            
            allBooks.forEach(book => {
                const option = document.createElement('option');
                option.value = book.id;
                const status = book.status === 'AVAILABLE' ? '(可借)' : '(已借出)';
                option.textContent = `${book.id}. ${book.title} - ${book.author} ${status}`;
                option.disabled = book.status !== 'AVAILABLE';
                select.appendChild(option);
            });

            select.addEventListener('change', showBookDetails);
            
            bookIdInput.parentElement.replaceChild(select, bookIdInput);
        }

        // Show selected book details
        function showBookDetails(e) {
            const bookId = e.target.value;
            const detailsDiv = document.getElementById('bookDetails') || createBookDetailsDiv();
            
            if (!bookId) {
                detailsDiv.style.display = 'none';
                return;
            }

            const book = allBooks.find(b => b.id == bookId);
            if (book) {
                detailsDiv.innerHTML = `
                    <div style="padding: 15px; background: #f5f5f0; border: 1px solid #e0e0d9; margin-top: 15px;">
                        <strong>${book.title}</strong><br>
                        作者: ${book.author}<br>
                        狀態: <span style="color: ${book.status === 'AVAILABLE' ? '#2e7d32' : '#d32f2f'};">${book.status === 'AVAILABLE' ? '可借閱' : '已借出'}</span>
                    </div>
                `;
                detailsDiv.style.display = 'block';
            }
        }

        function createBookDetailsDiv() {
            const div = document.createElement('div');
            div.id = 'bookDetails';
            div.style.display = 'none';
            document.getElementById('borrowForm').insertBefore(div, document.querySelector('.form-actions'));
            return div;
        }

        // Form submission
        document.getElementById('borrowForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                bookId: parseInt(document.getElementById('bookId').value),
                borrower: document.getElementById('borrower').value,
                borrowDate: document.getElementById('borrowDate').value,
                dueDate: document.getElementById('dueDate').value
            };

            try {
                const response = await fetch(BORROW_API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (!response.ok) {
                    throw new Error('新增失敗');
                }

                showMessage('借閱記錄新增成功！', 'success');
                document.getElementById('borrowForm').reset();
                document.getElementById('borrowDate').valueAsDate = new Date();
                loadBorrowRecords();
            } catch (error) {
                showMessage('錯誤: ' + error.message, 'error');
            }
        });

        // Load all borrow records
        async function loadBorrowRecords() {
            try {
                const response = await fetch(BORROW_API);
                if (!response.ok) {
                    throw new Error('載入失敗');
                }

                borrowRecords = await response.json();
                renderTable();
                updateStats();
            } catch (error) {
                showMessage('錯誤: ' + error.message, 'error');
            }
        }

        // Render table
        function renderTable() {
            const container = document.getElementById('tableContainer');

            if (borrowRecords.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-text">目前沒有借閱記錄</div></div>';
                return;
            }

            const table = document.createElement('table');
            table.innerHTML = `
                <thead>
                    <tr>
                        <th style="width: 8%;">編號</th>
                        <th style="width: 15%;">書籍名稱</th>
                        <th style="width: 15%;">借閱人</th>
                        <th style="width: 12%;">借閱日期</th>
                        <th style="width: 12%;">應還日期</th>
                        <th style="width: 12%;">實際還書</th>
                        <th style="width: 12%;">狀態</th>
                        <th style="width: 14%;">操作</th>
                    </tr>
                </thead>
                <tbody>
                    ${borrowRecords.map(record => {
                        const book = allBooks.find(b => b.id === record.bookId);
                        const bookTitle = book ? book.title : `書籍 #${record.bookId}`;
                        return `
                        <tr>
                            <td>${record.id}</td>
                            <td>${bookTitle}</td>
                            <td>${record.borrower}</td>
                            <td>${record.borrowDate}</td>
                            <td>${record.dueDate}</td>
                            <td>${record.returnDate || '-'}</td>
                            <td>
                                ${record.returnDate ? 
                                    '<span class="status-badge status-returned">已還</span>' : 
                                    (record.overdue ? 
                                        '<span class="status-badge status-overdue">逾期</span>' : 
                                        '<span class="status-badge status-borrowed">未還</span>'
                                    )
                                }
                            </td>
                            <td>
                                <div class="action-buttons">
                                    ${!record.returnDate ? `
                                        <button type="button" class="return-btn" onclick="markAsReturned(${record.id})">還書</button>
                                    ` : ''}
                                    <button type="button" class="delete-btn" onclick="deleteRecord(${record.id})">刪除</button>
                                </div>
                            </td>
                        </tr>
                    `}).join('')}
                </tbody>
            `;

            container.innerHTML = '';
            container.appendChild(table);
        }

        // Mark as returned
        async function markAsReturned(id) {
            const today = new Date().toISOString().split('T')[0];

            try {
                const response = await fetch(`${BORROW_API}/${id}/return?returnDate=${today}`, {
                    method: 'PUT'
                });

                if (!response.ok) {
                    throw new Error('還書失敗');
                }

                showMessage('已成功標記為還書！', 'success');
                loadBorrowRecords();
            } catch (error) {
                showMessage('錯誤: ' + error.message, 'error');
            }
        }

        // Delete record
        async function deleteRecord(id) {
            if (!confirm('確認要刪除此記錄嗎？')) {
                return;
            }

            try {
                const response = await fetch(`${BORROW_API}/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('刪除失敗');
                }

                showMessage('記錄已刪除！', 'success');
                loadBorrowRecords();
            } catch (error) {
                showMessage('錯誤: ' + error.message, 'error');
            }
        }

        // Update statistics
        function updateStats() {
            const total = borrowRecords.length;
            const borrowed = borrowRecords.filter(r => !r.returnDate).length;
            const returned = borrowRecords.filter(r => r.returnDate).length;
            const overdue = borrowRecords.filter(r => !r.returnDate && r.overdue).length;

            document.getElementById('totalRecords').textContent = total;
            document.getElementById('borrowedCount').textContent = borrowed;
            document.getElementById('returnedCount').textContent = returned;
            document.getElementById('overdueCount').textContent = overdue;
        }

        // Show message
        function showMessage(text, type) {
            const container = document.getElementById('messageContainer');
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = text;

            container.innerHTML = '';
            container.appendChild(message);

            setTimeout(() => {
                message.remove();
            }, 4000);
        }

        // Initial load - load books and borrow records
        loadAvailableBooks().then(() => loadBorrowRecords());
    </script>
</body>
</html>
